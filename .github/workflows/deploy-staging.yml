name: Deploy staging

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: inferlab-staging
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy staging
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Validate deployment configuration
        env:
          SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          SSH_USER: ${{ secrets.STAGING_SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.STAGING_KNOWN_HOSTS }}
          DEPLOY_DIR: ${{ secrets.STAGING_DEPLOY_DIR }}
          SESSION_SECRET: ${{ secrets.INFERLAB_SESSION_SECRET }}
          REGISTRY_USER: ${{ secrets.STAGING_REGISTRY_USER }}
          REGISTRY_TOKEN: ${{ secrets.STAGING_REGISTRY_TOKEN }}
        run: |
          set -Eeuo pipefail
          require_value() {
            local name="$1" value="$2"
            [[ -n "$value" ]] || { echo "$name is required" >&2; exit 1; }
          }
          require_value STAGING_SSH_HOST "$SSH_HOST"
          require_value STAGING_SSH_USER "$SSH_USER"
          require_value STAGING_SSH_PRIVATE_KEY "$SSH_PRIVATE_KEY"
          require_value STAGING_KNOWN_HOSTS "$SSH_KNOWN_HOSTS"
          require_value STAGING_DEPLOY_DIR "$DEPLOY_DIR"
          require_value INFERLAB_SESSION_SECRET "$SESSION_SECRET"
          require_value STAGING_REGISTRY_USER "$REGISTRY_USER"
          require_value STAGING_REGISTRY_TOKEN "$REGISTRY_TOKEN"
          [[ "$DEPLOY_DIR" == /* ]] || { echo "STAGING_DEPLOY_DIR must be absolute" >&2; exit 1; }
          [[ ${#SESSION_SECRET} -ge 32 ]] || { echo "INFERLAB_SESSION_SECRET must be at least 32 characters" >&2; exit 1; }

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        id: build_image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}:sha-${{ github.sha }}

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.STAGING_KNOWN_HOSTS }}
        run: |
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"

      - name: Prepare remote files
        env:
          STAGING_HOST: ${{ secrets.STAGING_SSH_HOST }}
          STAGING_USER: ${{ secrets.STAGING_SSH_USER }}
          DEPLOY_DIR: ${{ secrets.STAGING_DEPLOY_DIR }}
          IMAGE: ghcr.io/${{ github.repository }}@${{ steps.build_image.outputs.digest }}
          SESSION_SECRET: ${{ secrets.INFERLAB_SESSION_SECRET }}
        run: |
          env_file="$RUNNER_TEMP/inferlab-staging.env"
          umask 077
          if [[ "$SESSION_SECRET" == *$'\n'* || "$SESSION_SECRET" == *$'\r'* ]]; then
            echo "INFERLAB_SESSION_SECRET must not contain newlines" >&2
            exit 1
          fi
          printf 'INFERLAB_IMAGE=%s\nINFERLAB_SESSION_SECRET=%s\n' "$IMAGE" "$SESSION_SECRET" > "$env_file"
          ssh "$STAGING_USER@$STAGING_HOST" "mkdir -p '$DEPLOY_DIR/infra'"
          scp infra/docker-compose.yml infra/deploy-environment.sh "$STAGING_USER@$STAGING_HOST:$DEPLOY_DIR/infra/"
          scp "$env_file" "$STAGING_USER@$STAGING_HOST:$DEPLOY_DIR/.env"

      - name: Login to registry on staging host
        env:
          STAGING_HOST: ${{ secrets.STAGING_SSH_HOST }}
          STAGING_USER: ${{ secrets.STAGING_SSH_USER }}
          REGISTRY_USER: ${{ secrets.STAGING_REGISTRY_USER }}
          REGISTRY_TOKEN: ${{ secrets.STAGING_REGISTRY_TOKEN }}
        run: |
          printf '%s' "$REGISTRY_TOKEN" | ssh "$STAGING_USER@$STAGING_HOST" "docker login ghcr.io -u '$REGISTRY_USER' --password-stdin"

      - name: Deploy and health check
        env:
          STAGING_HOST: ${{ secrets.STAGING_SSH_HOST }}
          STAGING_USER: ${{ secrets.STAGING_SSH_USER }}
          DEPLOY_DIR: ${{ secrets.STAGING_DEPLOY_DIR }}
        run: ssh "$STAGING_USER@$STAGING_HOST" "chmod 700 '$DEPLOY_DIR/infra/deploy-environment.sh' && DEPLOY_DIR='$DEPLOY_DIR' bash '$DEPLOY_DIR/infra/deploy-environment.sh'"
