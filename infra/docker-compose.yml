services:
  inferlab:
    image: ${INFERLAB_IMAGE:-inferlab:local}
    build:
      context: ..
      dockerfile: infra/Dockerfile
    env_file:
      - path: ../.env.beta
        required: false
    environment:
      APP_ENV: ${INFERLAB_APP_ENV:-production}
      LISTEN_ADDR: 0.0.0.0:8080
      DB_PATH: /app/data/inferlab.db
      WEB_DIR: /app/web
      SESSION_SECRET: ${INFERLAB_SESSION_SECRET:?set INFERLAB_SESSION_SECRET before starting}
    ports:
      - "127.0.0.1:${INFERLAB_HTTP_PORT:-8080}:8080"
    volumes:
      - inferlab-data:/app/data
    restart: unless-stopped

volumes:
  inferlab-data:
